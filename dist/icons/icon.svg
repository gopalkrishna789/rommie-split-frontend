<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- House body -->
  <rect x="156" y="256" width="200" height="160" rx="12" fill="white" opacity="0.95"/>
  <!-- House roof -->
  <polygon points="256,120 136,256 376,256" fill="white"/>
  <!-- Door -->
  <rect x="220" y="320" width="72" height="96" rx="8" fill="#6366f1"/>
  <!-- Rupee symbol -->
  <text x="256" y="400" font-family="Arial,sans-serif" font-size="52" font-weight="900"
        fill="white" text-anchor="middle" dominant-baseline="middle">₹</text>
</svg>
